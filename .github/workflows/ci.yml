name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos keeps the zero-lint bar the codebase currently meets
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      # AGP 8.7 requires a JDK; pin 17 for reproducible builds
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      # Matches ndkVersion in android/app/build.gradle; installing explicitly
      # avoids relying on AGP's silent auto-install on a fresh runner
      - name: Install NDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;25.1.8937393" > /dev/null'

      - name: Install dependencies
        run: flutter pub get

      # Debug variant: full compile + Kotlin/Gradle checks, no signing needed.
      # pipefail is essential: without it the tee pipeline hides flutter's
      # exit code. On failure, emit the relevant Gradle error lines as
      # ::error:: annotations — those are readable via the public checks API
      # without an authenticated log download.
      - name: Build debug APK
        run: |
          set -o pipefail
          if flutter build apk --debug 2>&1 | tee /tmp/build.log; then
            echo "APK build succeeded"
          else
            code=$?
            echo "::error::flutter build apk --debug exited with code $code"
            grep -E "(error:|^e: |FAILURE|What went wrong|Caused by|Exception|AAPT|AndroidManifest)" /tmp/build.log | head -8 | while IFS= read -r l; do echo "::error::${l:0:1000}"; done
            exit $code
          fi

      # flutter-apk/ only receives release builds; debug lands in apk/debug/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
