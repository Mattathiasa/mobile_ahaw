name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --fatal-infos keeps the zero-lint bar the codebase currently meets
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      # AGP 8.7 requires a JDK; pin 17 for reproducible builds
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Needed so Gradle can auto-install the pinned NDK (25.1.8937393)
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: flutter pub get

      # Debug variant: full compile + Kotlin/Gradle checks, no signing needed
      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
