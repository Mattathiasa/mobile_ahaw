# 2G was not enough for JetifyTransform to rewrite the Flutter engine jar on
# the current toolchain — the build died with "Java heap space" partway through
# assembleDebug. 4G leaves room for that on an 8G+ machine.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
